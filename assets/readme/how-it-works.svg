<rect x="16" y="332" width="528" height="48" rx="10" fill="#005594"/><rect x="16.75" y="332.75" width="526.5" height="46.5" rx="9.25" fill="none" stroke="#DCD0FA" stroke-width="1.5"/><rect x="18.25" y="334.25" width="523.5" height="43.5" rx="7.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="19.75" y="335.75" width="520.5" height="40.5" rx="6.25" fill="none" stroke="#DCD0FA" stroke-width="1.5"/>
<circle cx="44" cy="356" r="16" fill="#FFFFFF"/><text x="44" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#6B3FD6">4</text>
<text x="72" y="362" font-size="18" font-weight="700" fill="#FFFFFF">Measure</text>
<text x="226" y="362" font-size="15" fill="#FFFFFF">See how fast it answers</text>
<rect x="16" y="388" width="528" height="48" rx="10" fill="#005594"/><rect x="16.75" y="388.75" width="526.5" height="46.5" rx="9.25" fill="none" stroke="#DCD0FA" stroke-width="1.5"/><rect x="18.25" y="390.25" width="523.5" height="43.5" rx="7.75" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="19.75" y="391.75" width="520.5" height="40.5" rx="6.25" fill="none" stroke="#DCD0FA" stroke-width="1.5"/>
<circle cx="44" cy="412" r="16" fill="#FFFFFF"/><text x="44" y="418" text-anchor="middle" font-size="18" font-weight="700" fill="#6B3FD6">5</text>
<text x="72" y="418" font-size="18" font-weight="700" fill="#FFFFFF">Find slowdowns</text>
<text x="226" y="418" font-size="15" fill="#FFFFFF">Spot what holds it back</text>
<rect x="16" y="452" width="528" height="64" rx="12" fill="#D9ECFA" stroke="#001C38" stroke-width="2" stroke-dasharray="7 5"/>
<text x="34" y="478" font-size="16" font-weight="700" fill="#00284A">Coming from NVIDIA CUDA?</text>
<text x="34" y="500" font-size="15" fill="#00284A">Two skills move your project over.</text>
